[project]
name = "tech-profile"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "bs4>=0.0.2",
    "jinja2>=3.1.6",
    "markdown>=3.10.2",
    "ollama>=0.6.2",
    "pypdf>=6.13.3",
    "python-frontmatter>=1.3.0",
    "requests>=2.34.2",
    "typst>=0.15.0",
    "weasyprint>=68.1",
]

[project.scripts]
skill-builder = "skill_builder.main:main"
build-job-app = "job_application.build:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
